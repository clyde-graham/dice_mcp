[project]
name = "dice-mcp-server"
version = "0.1.0"
description = "RPG dice roller MCP server for Claude Desktop"
requires-python = ">=3.10"

dependencies = [
    "d20>=1.1.2",
    "mcp[cli]>=1.0.0",
]

[project.scripts]
dice-mcp = "dice_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dice_server.py"]